<svg width="680" viewBox="0 0 680 1360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>LAMP pipeline flowchart</title>
  <desc>Flowchart showing the LAMP (LTR Annotation and Mining Pipeline) including CD-HIT-EST clustering step</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 14px; font-weight: 600; }
      .sub   { font-size: 12px; font-weight: 400; }
      .label { font-size: 11px; font-weight: 400; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-coral  { fill: #FAECE7; stroke: #D85A30; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-dashed { fill: none;    stroke: #B4B2A9; stroke-dasharray: 5 3; }
      .t-gray-title   { fill: #444441; }
      .t-gray-sub     { fill: #5F5E5A; }
      .t-purple-title { fill: #3C3489; }
      .t-purple-sub   { fill: #534AB7; }
      .t-teal-title   { fill: #085041; }
      .t-teal-sub     { fill: #0F6E56; }
      .t-coral-title  { fill: #712B13; }
      .t-coral-sub    { fill: #993C1D; }
      .t-amber-title  { fill: #633806; }
      line.arr { stroke: #888780; fill: none; }
    </style>
  </defs>

  <!-- RepeatModeler2 dashed container -->
  <rect x="60" y="20" width="560" height="100" rx="10" stroke-width="0.8" class="box-dashed"/>
  <text x="340" y="41" text-anchor="middle" class="label t-gray-sub">RepeatModeler2 output</text>
  <rect x="80" y="52" width="230" height="52" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="195" y="71" text-anchor="middle" class="title t-gray-title">Consensus FASTA</text>
  <text x="195" y="89" text-anchor="middle" class="sub t-gray-sub">*-families.fa</text>
  <rect x="330" y="52" width="270" height="52" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="465" y="71" text-anchor="middle" class="title t-gray-title">Stockholm alignment file</text>
  <text x="465" y="89" text-anchor="middle" class="sub t-gray-sub">*-families.stk · all families concatenated</text>

  <!-- Genome input -->
  <rect x="200" y="146" width="280" height="52" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="340" y="165" text-anchor="middle" class="title t-gray-title">Genome FASTA</text>
  <text x="340" y="183" text-anchor="middle" class="sub t-gray-sub">Any assembly · any chromosome naming</text>

  <!-- RM2 FASTA + STK into Stage 1 -->
  <line x1="195" y1="104" x2="250" y2="234" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="465" y1="104" x2="390" y2="234" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 1: CD-HIT-EST clustering -->
  <rect x="110" y="234" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="256" text-anchor="middle" class="title t-purple-title">Stage 1: Within-type consensus clustering</text>
  <text x="340" y="275" text-anchor="middle" class="sub t-purple-sub">cd-hit-est · 80% identity · LTR vs LTR, INT vs INT · keep longest representative</text>

  <!-- Side output: families_merged.tsv -->
  <line x1="570" y1="267" x2="614" y2="267" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <text x="618" y="260" class="label t-gray-sub">families_</text>
  <text x="618" y="276" class="label t-gray-sub">merged.tsv</text>

  <!-- Stage 1 -> Stage 2 -->
  <line x1="340" y1="300" x2="340" y2="330" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Genome arrow into Stage 2 -->
  <line x1="340" y1="198" x2="340" y2="330" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 2: LTR-INT classification -->
  <rect x="110" y="330" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="352" text-anchor="middle" class="title t-purple-title">Stage 2: LTR–INT family classification</text>
  <text x="340" y="371" text-anchor="middle" class="sub t-purple-sub">Parse Stockholm · remap merged families · match pairs within 1 kb</text>

  <!-- Branch -->
  <line x1="270" y1="396" x2="195" y2="428" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="410" y1="396" x2="485" y2="428" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <rect x="50"  y="428" width="285" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="192" y="447" text-anchor="middle" class="title t-teal-title">Matched families</text>
  <text x="192" y="465" text-anchor="middle" class="sub t-teal-sub">LTR + INT pair found within 1 kb</text>

  <rect x="345" y="428" width="285" height="52" rx="8" stroke-width="0.5" class="box-coral"/>
  <text x="487" y="447" text-anchor="middle" class="title t-coral-title">Unmatched families</text>
  <text x="487" y="465" text-anchor="middle" class="sub t-coral-sub">LTR-only or INT-only</text>

  <!-- Merge back -->
  <line x1="192" y1="480" x2="280" y2="512" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="487" y1="480" x2="400" y2="512" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 3: BLAST -->
  <rect x="110" y="512" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="534" text-anchor="middle" class="title t-purple-title">Stage 3: Genome-wide BLAST</text>
  <text x="340" y="553" text-anchor="middle" class="sub t-purple-sub">BLASTn vs genome · e-value ≤1e-5 · ≥60% query coverage · per category</text>
  <line x1="340" y1="578" x2="340" y2="608" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 4: Dedup -->
  <rect x="110" y="608" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="630" text-anchor="middle" class="title t-purple-title">Stage 4: Deduplication</text>
  <text x="340" y="649" text-anchor="middle" class="sub t-purple-sub">Remove overlapping hits · keep highest identity per locus</text>
  <line x1="340" y1="674" x2="340" y2="704" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 5: Flanking -->
  <rect x="110" y="704" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="726" text-anchor="middle" class="title t-purple-title">Stage 5: Flanking region extraction</text>
  <text x="340" y="745" text-anchor="middle" class="sub t-purple-sub">±14 kb window (configurable) · bedtools getfasta · coords in FASTA header</text>
  <line x1="340" y1="770" x2="340" y2="800" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 6: CDD -->
  <rect x="110" y="800" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="822" text-anchor="middle" class="title t-purple-title">Stage 6: CDD domain search</text>
  <text x="340" y="841" text-anchor="middle" class="sub t-purple-sub">rpstblastn · parallel per family · NCBI API name resolution · e-value ≤1e-3</text>
  <line x1="340" y1="866" x2="340" y2="896" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Stage 7: GFF -->
  <rect x="110" y="896" width="460" height="66" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="918" text-anchor="middle" class="title t-purple-title">Stage 7: GFF3 and CSV writing</text>
  <text x="340" y="937" text-anchor="middle" class="sub t-purple-sub">Human-readable domain names · original BLAST coords embedded</text>

  <!-- Four output arrows -->
  <line x1="196" y1="962" x2="100" y2="994" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="280" y1="962" x2="268" y2="994" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="400" y1="962" x2="412" y2="994" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <line x1="484" y1="962" x2="572" y2="994" stroke-width="1" marker-end="url(#arrow)" class="arr"/>

  <!-- Four outputs -->
  <rect x="36"  y="994" width="156" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="114" y="1013" text-anchor="middle" class="title t-teal-title">GFF3 per family</text>
  <text x="114" y="1031" text-anchor="middle" class="sub t-teal-sub">Domain · e-value</text>

  <rect x="200" y="994" width="156" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="278" y="1013" text-anchor="middle" class="title t-teal-title">FASTA per family</text>
  <text x="278" y="1031" text-anchor="middle" class="sub t-teal-sub">Flanking sequences</text>

  <rect x="364" y="994" width="156" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="442" y="1013" text-anchor="middle" class="title t-teal-title">CDD summary CSV</text>
  <text x="442" y="1031" text-anchor="middle" class="sub t-teal-sub">All hits across families</text>

  <rect x="528" y="994" width="116" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="586" y="1013" text-anchor="middle" class="title t-teal-title">Summary TSV</text>
  <text x="586" y="1031" text-anchor="middle" class="sub t-teal-sub">Coords · pident</text>

  <!-- Legend -->
  <rect x="60" y="1096" width="560" height="234" rx="8" stroke-width="0.5" class="box-dashed"/>
  <text x="340" y="1120" text-anchor="middle" class="title t-gray-title">Detectable LTR element structures</text>

  <!-- Row 1 -->
  <text x="76" y="1158" class="label t-gray-sub">Full-length</text>
  <rect x="148" y="1144" width="54" height="28" rx="5" stroke-width="0.5" class="box-amber"/>
  <text x="175" y="1158" text-anchor="middle" class="label t-amber-title">LTR</text>
  <line x1="202" y1="1158" x2="214" y2="1158" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="214" y="1144" width="54" height="28" rx="5" stroke-width="0.5" class="box-coral"/>
  <text x="241" y="1158" text-anchor="middle" class="label t-coral-title">GAG</text>
  <line x1="268" y1="1158" x2="280" y2="1158" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="280" y="1144" width="54" height="28" rx="5" stroke-width="0.5" class="box-purple"/>
  <text x="307" y="1158" text-anchor="middle" class="label t-purple-title">POL</text>
  <line x1="334" y1="1158" x2="346" y2="1158" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="346" y="1144" width="54" height="28" rx="5" stroke-width="0.5" class="box-teal"/>
  <text x="373" y="1158" text-anchor="middle" class="label t-teal-title">ENV</text>
  <line x1="400" y1="1158" x2="412" y2="1158" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="412" y="1144" width="54" height="28" rx="5" stroke-width="0.5" class="box-amber"/>
  <text x="439" y="1158" text-anchor="middle" class="label t-amber-title">LTR</text>
  <text x="478" y="1158" class="label t-gray-sub">e.g. ERV</text>

  <!-- Row 2 -->
  <text x="76" y="1210" class="label t-gray-sub">No ENV</text>
  <rect x="148" y="1196" width="54" height="28" rx="5" stroke-width="0.5" class="box-amber"/>
  <text x="175" y="1210" text-anchor="middle" class="label t-amber-title">LTR</text>
  <line x1="202" y1="1210" x2="214" y2="1210" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="214" y="1196" width="54" height="28" rx="5" stroke-width="0.5" class="box-coral"/>
  <text x="241" y="1210" text-anchor="middle" class="label t-coral-title">GAG</text>
  <line x1="268" y1="1210" x2="280" y2="1210" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="280" y="1196" width="54" height="28" rx="5" stroke-width="0.5" class="box-purple"/>
  <text x="307" y="1210" text-anchor="middle" class="label t-purple-title">POL</text>
  <line x1="334" y1="1210" x2="412" y2="1210" stroke-width="1" marker-end="url(#arrow)" class="arr"/>
  <rect x="412" y="1196" width="54" height="28" rx="5" stroke-width="0.5" class="box-amber"/>
  <text x="439" y="1210" text-anchor="middle" class="label t-amber-title">LTR</text>
  <text x="478" y="1210" class="label t-gray-sub">e.g. copia/gypsy</text>

  <!-- Row 3 -->
  <text x="76" y="1262" class="label t-gray-sub">Solo LTR</text>
  <rect x="148" y="1248" width="54" height="28" rx="5" stroke-width="0.5" class="box-amber"/>
  <text x="175" y="1262" text-anchor="middle" class="label t-amber-title">LTR</text>
  <text x="216" y="1262" class="label t-gray-sub">internal region deleted · detectable by BLAST alone</text>
</svg>
